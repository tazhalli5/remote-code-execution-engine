services:
  api:
    build: .
    container_name: rce_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://rce_user:rce_password@db:5432/rce_db
      - REDIS_HOST=redis
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:15-alpine
    container_name: rce_db
    restart: always
    environment:
      POSTGRES_USER: rce_user
      POSTGRES_PASSWORD: rce_password
      POSTGRES_DB: rce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rce_user -d rce_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rce_redis
    restart: always
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: rce_celery
    command: celery -A task.celery_app worker --loglevel=info
    restart: always
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=postgresql://rce_user:rce_password@db:5432/rce_db
      - REDIS_HOST=redis
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
       
